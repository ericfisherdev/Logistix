name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Logistix.csproj

      - name: Build and package
        run: dotnet build Logistix.csproj --configuration Release --no-restore

      - name: Upload Thunderstore package
        uses: actions/upload-artifact@v7
        with:
          name: Logistix-thunderstore
          path: dist/*.zip
          if-no-files-found: error
